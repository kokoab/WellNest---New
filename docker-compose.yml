services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: laravel_db_wellnest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - backend

  # PHP-FPM service
  backend_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_app_wellnest
    restart: unless-stopped
    working_dir: /var/www/laravel
    volumes:
      - ./backend/src:/var/www
      - ./backend/storage:/var/www/laravel/storage:delegated
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-1}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-wellnest}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-dev-secret-change-in-production}
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  # Nginx web server
  backend_nginx:
    image: nginx:alpine
    container_name: laravel_nginx_wellnest
    restart: unless-stopped
    ports:
      - "8080:80" # This is your entry point from the host
    volumes:
      - ./backend/src:/var/www
      - ./backend/storage:/var/www/laravel/storage
      - ./backend/nginx:/etc/nginx/conf.d
    depends_on:
      - backend_app
    networks:
      - backend

  # Laravel Reverb (WebSocket server for real-time chat/broadcasting)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_reverb_wellnest
    restart: unless-stopped
    working_dir: /var/www/laravel
    volumes:
      - ./backend/src:/var/www
      - ./backend/storage:/var/www/laravel/storage
    command: ["php", "artisan", "reverb:start"]
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REVERB_APP_ID=${REVERB_APP_ID:-1}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-wellnest}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-dev-secret-change-in-production}
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8081
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge