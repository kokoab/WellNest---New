services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: laravel_db_wellnest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - backend

  # PHP-FPM service
  backend_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_app_wellnest
    restart: unless-stopped
    working_dir: /var/www/laravel
    volumes:
      - ./backend/src:/var/www
      - ./backend/storage:/var/www/laravel/storage:delegated
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_SCHEME=${MAIL_SCHEME}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - BROADCAST_CONNECTION=log
      - QUEUE_CONNECTION=database
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  # Reverb WebSocket server (for real-time events)
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_reverb_wellnest
    restart: unless-stopped
    working_dir: /var/www/laravel
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./backend/src:/var/www
      - ./backend/storage:/var/www/laravel/storage:delegated
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - BROADCAST_CONNECTION=reverb
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_APP_KEY=efcct5mu8lg3nxzgpixd
      - REVERB_APP_SECRET=laravel_reverb_secret
      - REVERB_APP_ID=1
    ports:
      - "8081:8080"
    depends_on:
      database:
        condition: service_healthy
      backend_app:
        condition: service_started
    networks:
      - backend

  # Queue worker (processes broadcast jobs, notifications, etc.)
  queue_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_queue_wellnest
    restart: unless-stopped
    working_dir: /var/www/laravel
    command: php artisan queue:work --queue=default --tries=3 --timeout=90
    volumes:
      - ./backend/src:/var/www
      - ./backend/storage:/var/www/laravel/storage:delegated
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_SCHEME=${MAIL_SCHEME}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_SCHEME=${MAIL_SCHEME}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - BROADCAST_CONNECTION=reverb
      - QUEUE_CONNECTION=database
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_APP_KEY=efcct5mu8lg3nxzgpixd
      - REVERB_APP_SECRET=laravel_reverb_secret
      - REVERB_APP_ID=1
    depends_on:
      database:
        condition: service_healthy
      backend_app:
        condition: service_started
      reverb:
        condition: service_started
    networks:
      - backend

  # Nginx web server
  backend_nginx:
    image: nginx:alpine
    container_name: laravel_nginx_wellnest
    restart: unless-stopped
    ports:
      - "8080:80" # This is your entry point from the host
    volumes:
      - ./backend/src:/var/www
      - ./backend/storage:/var/www/laravel/storage
      - ./backend/nginx:/etc/nginx/conf.d
    depends_on:
      - backend_app
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge