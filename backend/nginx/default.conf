server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/laravel/public;

    # Default nginx limit is 1m — multipart recipe/post photos exceed that (Laravel allows 5MB/file).
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend_app:9000;          # service name from docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location /storage/ {
        add_header Access-Control-Allow-Origin *;
    }

    # Reverb WebSocket — proxy /app/* to the reverb container so the iPhone
    # only needs port 8080 (already allowed through the macOS firewall).
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ /\.ht {
        deny all;
    }
}