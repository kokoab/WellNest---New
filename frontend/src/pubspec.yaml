name: my_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  pusher_reverb_flutter: ^0.0.4
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.0.7
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  pdf: ^3.11.1
  shimmer: ^3.0.0
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/
    - fonts/

  fonts:
    - family: Recoleta
      fonts:
        - asset: fonts/fonnts.com-recoleta-bold.otf
          weight: 700
        - asset: fonts/fonnts.com-recoleta-semibold.otf
          weight: 600
    - family: HelveticaNow
      fonts:
        - asset: fonts/HelveticaNowDisplay-Regular.ttf
          weight: 400
        - asset: fonts/HelveticaNowDisplay-Bold.ttf
          weight: 700
    - family: GeorgiaPro
      fonts:
        - asset: fonts/GeorgiaPro-Regular.ttf
          weight: 400
        - asset: fonts/GeorgiaPro-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/GeorgiaPro-SemiBold.ttf
          weight: 600
        - asset: fonts/GeorgiaPro-Bold.ttf
          weight: 700

